<!-- Header -->
<header class="header">
    <div class="header-fixed">
    <nav class="navbar navbar-expand-lg header-nav">
        <div class="navbar-header">
            <a id="mobile_btn" href="javascript:void(0);">
                <span class="bar-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </a>
            <a href="/" class="navbar-brand logo">
                <img src="assets/img/logo.png" class="img-fluid" alt="Logo">
            </a>
        </div>
        <div class="main-menu-wrapper">
            <div class="menu-header">
                <a href="/" class="menu-logo">
                    <img src="assets/img/logo.png" class="img-fluid" alt="Logo">
                </a>
                <a id="menu_close" class="menu-close" href="javascript:void(0);">
                    <i class="fas fa-times"></i>
                </a>
            </div>
            <ul class="main-nav" *ngIf="isLoggedIn();">
                <li>
                    <a [routerLink]="'dashboard'">My Dashboard</a>
                </li>
                <li>
                    <a [routerLink]="'messages'">Messages</a>
                </li>
                <li>
                    <a [routerLink]="'listings'">My Listings</a>
                </li>
                <li>
                    <a [routerLink]="'dashboard/profile'">My Profile</a>
                </li>
                <li class="login-link">
                    <a href="javascript:void(0);" (click)="logout()">Logout</a>
                </li>
            </ul>			
            <ul class="main-nav" *ngIf="!isLoggedIn();">
                <li class="login-link">
                    <a [routerLink]="'signin'">Login / Signup</a>
                </li>
            </ul>		 
        </div>		 
        <ul class="nav header-navbar-rht">
            <li class="nav-item" *ngIf="!isLoggedIn()">
                <a class="nav-link header-login" href="signup"><img src="assets/img/icon/sign-icon.svg" alt=""> Sign up</a>
            </li>
            <li class="nav-item" *ngIf="!isLoggedIn()">
                <a class="nav-link" href="signin"> <img src="assets/img/icon/log-icon.svg" alt=""> Log In</a>
            </li>

            <li class="nav-item dropdown has-arrow logged-item" *ngIf="isLoggedIn()">
                <a href="#" class="dropdown-toggle nav-link" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="user-img">
                        <img class="rounded-circle" src="assets/img/user/user.jpg" width="31" alt="Darren Elder">
                    </span>
                </a>
                <div class="dropdown-menu dropdown-menu-end">
                    <div class="user-header">
                        <div class="avatar avatar-sm">
                            <img src="assets/img/user/user.jpg" alt="User Image" class="avatar-img rounded-circle">
                        </div>
                        <div class="user-text">
                            <h6>Jonathan Doe</h6>
                            <p class="text-muted mb-0">Mentor</p>
                        </div>
                    </div>
                    <a class="dropdown-item" [routerLink]="'/dashboard'">Dashboard</a>
                    <a class="dropdown-item" [routerLink]="'profile'">Profile Settings</a>
                    <a class="dropdown-item" (click)="logout()" role="button">Logout</a>
                </div>
            </li>
        </ul>
    </nav>
    <div class="sidebar-overlay"></div>
    </div>
</header>
<!-- /Header -->
