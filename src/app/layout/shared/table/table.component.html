<div class="card card-table">
    <div class="card-body">
        <!-- Page size selection -->
        <div class="d-flex justify-content-between mb-3">
            <div>
                <label for="pageSize">Show entries:</label>
                <select id="pageSize" class="form-select d-inline-block w-auto ms-2"
                    (change)="onPageSizeChange($event)">
                    <option *ngFor="let size of pageSizeOptions" [value]="size" [selected]="size === pageSize">{{ size
                        }}</option>
                </select>
            </div>
            <div>
                <p>Page {{ page }} of {{ totalPages }}</p>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-hover table-center mb-0">
                <thead>
                    <tr>
                        <th *ngFor="let column of columns">{{ column.label }}</th>
                        <th *ngIf="actions.length">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of data">
                        <td *ngFor="let column of columns">
                            <ng-container *ngIf="column.cellTemplate; else defaultCell">
                                <ng-container
                                    *ngTemplateOutlet="column.cellTemplate; context: { $implicit: item, value: getValue(item, column.key) }">
                                </ng-container>
                            </ng-container>

                            <ng-template #defaultCell>
                                <span [innerHTML]="getValue(item, column.key)"></span>
                            </ng-template>
                        </td>
                        <td *ngIf="actions.length">
                            <div class="table-action">
                                <ng-container *ngFor="let action of actions">
                                    <button class="btn btn-sm" [ngClass]="action.class"
                                        *ngIf="!action.condition || action.condition(item)"
                                        (click)="action.callback(item)">
                                        <i class="fas" [ngClass]="action.icon"></i> {{ action.label }}
                                    </button>
                                </ng-container>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- No data message -->
        <div class="no-sessions text-center mt-3" *ngIf="data.length === 0">
            <p>No data available.</p>
        </div>

        <!-- Pagination Controls -->
        <nav class="mt-3">
            <ul class="pagination justify-content-center">
                <li class="page-item" [class.disabled]="page === 1">
                    <a class="page-link" (click)="onPageChange(page - 1)">Previous</a>
                </li>
                <li class="page-item" *ngFor="let i of [].constructor(totalPages); let idx = index"
                    [class.active]="page === idx + 1">
                    <a class="page-link" (click)="onPageChange(idx + 1)">{{ idx + 1 }}</a>
                </li>
                <li class="page-item" [class.disabled]="page === totalPages">
                    <a class="page-link" (click)="onPageChange(page + 1)">Next</a>
                </li>
            </ul>
        </nav>

    </div>
</div>
